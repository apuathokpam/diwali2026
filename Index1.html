
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali Celebration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #4b075e, #160020, #05000c);
    color: white;
    font-family: Georgia, serif;
    text-align: center;
}

.container {
    position: relative;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    padding: 20px;
}

h1 {
    font-size: clamp(38px, 8vw, 75px);
    color: #ffd700;
    text-shadow: 0 0 15px orange, 0 0 35px gold;
    animation: glow 2s infinite alternate;
}

.subtitle {
    font-size: 22px;
    margin-top: 20px;
    color: #fff3b0;
    animation: fade 3s infinite alternate;
}

.diyas {
    display: flex;
    justify-content: center;
    gap: 45px;
    margin-top: 65px;
    flex-wrap: wrap;
}

.diya {
    font-size: 65px;
    animation: bounce 2s infinite;
    filter: drop-shadow(0 0 15px orange);
}

.diya:nth-child(2) {
    animation-delay: .5s;
}

.diya:nth-child(3) {
    animation-delay: 1s;
}

button {
    margin-top: 40px;
    padding: 14px 30px;
    border: 2px solid gold;
    border-radius: 30px;
    background: linear-gradient(45deg, orange, gold);
    color: #4b075e;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px orange;
}

button:hover {
    transform: scale(1.1);
}

@keyframes glow {
    from { text-shadow: 0 0 10px gold; }
    to { text-shadow: 0 0 35px orange, 0 0 60px gold; }
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

@keyframes fade {
    from { opacity: .5; }
    to { opacity: 1; }
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(gold 1px, transparent 1px);
    background-size: 70px 70px, 110px 110px;
    animation: starsMove 15s linear infinite;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-70px); }
}

footer {
    margin-top: 35px;
    color: #ffdb70;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="stars"></div>
<canvas id="fireworks"></canvas>

<div class="container">

    <h1>✨ Happy Diwali ✨</h1>

    <p class="subtitle">
        May your life shine like a million lamps! 
        <br>
        Wishing you happiness, prosperity and success.
    </p>

    <div class="diyas">
        <div class="diya">🪔</div>
        <div class="diya">🪔</div>
        <div class="diya">🪔</div>
    </div>

    <button onclick="celebrate()">
        🎆 Celebrate Diwali 🎆
    </button>

    <footer>
        ❤️ May this festival of lights brighten your life ❤️
    </footer>

</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function createFirework(x, y) {
    const colors = ["#ffcc00", "#ff4500", "#ff00ff",
                    "#00ffff", "#ffffff", "#00ff66"];

    for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 100,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.025;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) {
            particles.splice(index, 1);
        }
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}

animate();

// Automatic fireworks
function automaticFireworks() {
    createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.65
    );
}

setInterval(automaticFireworks, 1200);

// Celebrate button
function celebrate() {
    for (let i = 0; i < 6; i++) {
        createFirework(
            Math.random() * canvas.width,
            Math.random() * canvas.height * 0.65
        );
    }
}
</script>

</body>
</html>
